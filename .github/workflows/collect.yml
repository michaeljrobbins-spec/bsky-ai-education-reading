name: Collect and publish

# Run once, by hand: Actions tab -> "Collect and publish" -> Run workflow.
# There is deliberately no schedule.
on:
  workflow_dispatch:
    inputs:
      max_posts:
        description: "Maximum number of posts in the sample"
        type: number
        default: 2000
      overwrite:
        description: "Replace data that was already collected (normally leave off)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Refuse to overwrite existing data
        if: ${{ !inputs.overwrite }}
        run: |
          if [ -f site/data/data.json ]; then
            echo "::error::Data has already been collected. Re-run with 'overwrite' ticked only if you really mean to replace it."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect posts from Bluesky
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MAX_POSTS: ${{ inputs.max_posts }}
        working-directory: pipeline
        run: python collect.py --out "$RUNNER_TEMP/raw.json" --max-posts "$MAX_POSTS"

      - name: Score sentiment, fit topics, write excerpts
        working-directory: pipeline
        run: |
          mkdir -p ../site/data
          python analyze.py --in "$RUNNER_TEMP/raw.json" --out ../site/data/data.json

      - name: Delete full post text
        if: always()
        run: rm -f "$RUNNER_TEMP/raw.json"

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/data.json
          git commit -m "Add collected Bluesky sample (excerpts only)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  deploy:
    needs: collect
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
